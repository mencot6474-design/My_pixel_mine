<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" width="600" height="210">
  <defs>
    <linearGradient id="novelObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191d30"/>
      <stop offset="48%" stop-color="#0d101b"/>
      <stop offset="100%" stop-color="#1c162b"/>
    </linearGradient>

    <linearGradient id="novelSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff8dc" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#fde68a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="novelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="28%" stop-color="#f3d184"/>
      <stop offset="56%" stop-color="#c69138"/>
      <stop offset="82%" stop-color="#f8e09e"/>
      <stop offset="100%" stop-color="#fff7d6"/>
    </linearGradient>

    <linearGradient id="novelText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#fef3c7"/>
      <stop offset="78%" stop-color="#e5b961"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>

    <clipPath id="novelPlateClip">
      <polygon points="56,105 98,38 502,38 544,105 502,172 98,172"/>
    </clipPath>
  </defs>

  <!-- Minimalist Side Diamond Finials -->
  <g stroke="#14111d" stroke-width="5" stroke-linejoin="round">
    <polygon points="18,105 42,88 66,105 42,122" fill="url(#novelGold)"/>
    <polygon points="534,105 558,88 582,105 558,122" fill="url(#novelGold)"/>
  </g>

  <!-- Outer Obsidian Beveled Plaque -->
  <polygon
    points="50,105 94,32 506,32 550,105 506,178 94,178"
    fill="url(#novelObsidian)"
    stroke="#14111d"
    stroke-width="9"
    stroke-linejoin="round"
  />

  <!-- Subtle Diagonal Editorial Sheen -->
  <g clip-path="url(#novelPlateClip)">
    <polygon points="150,24 275,24 210,186 85,186" fill="url(#novelSheen)"/>
    <polygon points="355,24 440,24 375,186 290,186" fill="url(#novelSheen)"/>
  </g>

  <!-- Crisp Hairline Champagne-Gold Inner Frame -->
  <polygon
    points="60,105 100,40 500,40 540,105 500,170 100,170"
    fill="none"
    stroke="url(#novelGold)"
    stroke-width="4.5"
    stroke-linejoin="round"
  />

  <!-- Delicate Inner Micro-Line -->
  <polygon
    points="74,105 108,50 492,50 526,105 492,160 108,160"
    fill="none"
    stroke="#fde68a"
    stroke-opacity="0.28"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Top & Bottom Center Jewel Pips -->
  <polygon points="300,18 313,34 300,50 287,34" fill="url(#novelGold)" stroke="#14111d" stroke-width="4.5" stroke-linejoin="round"/>
  <polygon points="300,164 310,176 300,188 290,176" fill="url(#novelGold)" stroke="#14111d" stroke-width="4" stroke-linejoin="round"/>

  <!-- Left & Right 4-Point Editorial Stars -->
  <path d="M 118 89 L 122 101 L 134 105 L 122 109 L 118 121 L 114 109 L 102 105 L 114 101 Z" fill="url(#novelGold)"/>
  <path d="M 482 89 L 486 101 L 498 105 L 486 109 L 482 121 L 478 109 L 466 105 L 478 101 Z" fill="url(#novelGold)"/>

  <!-- Sharp Editorial "NOVEL" Typography -->
  <text
    x="302"
    y="129"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="74"
    font-weight="900"
    letter-spacing="12"
    fill="url(#novelText)"
    stroke="#090b12"
    stroke-width="5"
    paint-order="stroke fill"
  >NOVEL</text>
</svg>
