<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="omegaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="crimsonWingHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="35%" stop-color="#fb7185"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="crimsonWingShad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="obsidianWingHi" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="obsidianWingShad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="omegaPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="35%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#14111d"/>
      <stop offset="68%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="omegaTextGrad" x1="-100%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="22%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="58%" stop-color="#f87171"/>
      <stop offset="78%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#fde047"/>
      <animate attributeName="x1" values="-100%;0%" dur="2.0s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%" dur="2.0s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="omegaGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="omegaClip">
      <path d="M 186 226 L 228 174 L 348 168 L 400 154 L 452 168 L 572 174 L 614 226 L 572 278 L 452 284 L 400 298 L 348 284 L 228 278 Z"/>
    </clipPath>
    <filter id="omegaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes wingL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(2.6deg); } }
      @keyframes wingR { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-2.6deg); } }
      @keyframes haloSpin { 0%,100% { transform: translateY(0px); opacity: 0.94; } 50% { transform: translateY(-4px); opacity: 1; } }
      @keyframes glintMove { 0%,45% { transform: translateX(-340px) skewX(-24deg); } 100% { transform: translateX(520px) skewX(-24deg); } }
      .wing-l { transform-origin: 225px 226px; animation: wingL 2.2s ease-in-out infinite; }
      .wing-r { transform-origin: 575px 226px; animation: wingR 2.2s ease-in-out infinite; }
      .halo { animation: haloSpin 2.1s ease-in-out infinite; }
      .glint-bar { animation: glintMove 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Spiked Iron-Gold Omega Halo -->
  <g class="halo" filter="url(#omegaGlow)" stroke="#14111d" stroke-width="2.2" stroke-linejoin="round">
    <circle cx="400" cy="148" r="66" fill="none" stroke="url(#omegaGold)" stroke-width="7"/>
    <polygon points="400,46 392,88 408,88" fill="url(#omegaGold)"/>
    <polygon points="338,68 352,102 365,94" fill="url(#omegaGold)"/>
    <polygon points="462,68 435,94 448,102" fill="url(#omegaGold)"/>
    <polygon points="292,110 326,126 333,112" fill="url(#omegaGold)"/>
    <polygon points="508,110 467,112 474,126" fill="url(#omegaGold)"/>
  </g>

  <!-- Left Crimson Blade Wings -->
  <g class="wing-l" stroke="#14111d" stroke-width="3.2" stroke-linejoin="round">
    <path d="M 225 204 C 142 162, 74 114, 22 68 C 52 126, 112 174, 202 218 Z" fill="url(#crimsonWingHi)"/>
    <path d="M 212 218 C 134 198, 74 170, 36 138 C 76 184, 130 214, 200 232 Z" fill="url(#crimsonWingHi)"/>
    <path d="M 206 234 C 142 226, 92 212, 56 194 C 94 228, 140 244, 202 248 Z" fill="url(#crimsonWingShad)"/>
    <path d="M 226 198 L 170 184 L 154 214 L 200 252 L 230 240 Z" fill="url(#omegaGold)"/>
  </g>

  <!-- Right Obsidian-Silver Blade Wings -->
  <g class="wing-r" stroke="#14111d" stroke-width="3.2" stroke-linejoin="round">
    <path d="M 575 204 C 658 162, 726 114, 778 68 C 748 126, 688 174, 598 218 Z" fill="url(#obsidianWingHi)"/>
    <path d="M 588 218 C 666 198, 726 170, 764 138 C 724 184, 670 214, 600 232 Z" fill="url(#obsidianWingHi)"/>
    <path d="M 594 234 C 658 226, 708 212, 744 194 C 706 228, 660 244, 598 248 Z" fill="url(#obsidianWingShad)"/>
    <path d="M 574 198 L 630 184 L 646 214 L 600 252 L 570 240 Z" fill="url(#omegaGold)"/>
  </g>

  <!-- Outer Beveled Gold Shield Frame -->
  <path d="M 172 226 L 218 166 L 344 158 L 400 144 L 456 158 L 582 166 L 628 226 L 582 286 L 456 294 L 400 310 L 344 294 L 218 286 Z"
        fill="url(#omegaGold)" stroke="#14111d" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner Split Crimson / Obsidian Plate -->
  <path d="M 186 226 L 228 174 L 348 168 L 400 154 L 452 168 L 572 174 L 614 226 L 572 278 L 452 284 L 400 298 L 348 284 L 228 278 Z"
        fill="url(#omegaPlate)" stroke="#14111d" stroke-width="3" stroke-linejoin="round"/>

  <g clip-path="url(#omegaClip)">
    <path d="M 412 154 L 386 298" stroke="#fde047" stroke-width="3" opacity="0.55"/>
    <rect class="glint-bar" x="280" y="138" width="96" height="186" fill="url(#omegaGlint)"/>
  </g>

  <!-- Bold Animated "OMEGA" Text -->
  <g transform="translate(400, 258)">
    <text x="0" y="6" text-anchor="middle" font-family="'Arial Black', Impact, 'Rubik', sans-serif" font-size="94" font-weight="900" letter-spacing="6"
          fill="#14111d" stroke="#14111d" stroke-width="14" stroke-linejoin="round">OMEGA</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black', Impact, 'Rubik', sans-serif" font-size="94" font-weight="900" letter-spacing="6"
          fill="url(#omegaTextGrad)" stroke="#14111d" stroke-width="7" paint-order="stroke fill" stroke-linejoin="round">OMEGA</text>
  </g>

  <!-- Side & Bottom Jewels -->
  <g transform="translate(174, 226)">
    <polygon points="0,-24 24,0 0,24 -24,0" fill="url(#omegaGold)" stroke="#14111d" stroke-width="3"/>
    <polygon points="0,-14 14,0 0,14 -14,0" fill="#ef4444" stroke="#14111d" stroke-width="1.6"/>
  </g>
  <g transform="translate(626, 226)">
    <polygon points="0,-24 24,0 0,24 -24,0" fill="url(#omegaGold)" stroke="#14111d" stroke-width="3"/>
    <polygon points="0,-14 14,0 0,14 -14,0" fill="#94a3b8" stroke="#14111d" stroke-width="1.6"/>
  </g>
  <g transform="translate(400, 312)">
    <polygon points="0,-22 24,0 0,22 -24,0" fill="url(#omegaGold)" stroke="#14111d" stroke-width="3"/>
    <polygon points="0,-13 13,0 0,13 -13,0" fill="#fde047" stroke="#14111d" stroke-width="1.6"/>
  </g>
</svg>
